---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: mithril
description: My modification of Fedora Silverblue.
base-image: ghcr.io/ublue-os/silverblue-nvidia
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /
      - source: wallpapers
        destination: /usr/share/backgrounds
      - source: sounds
        destination: /usr/share/themes
      - source: cursors
        destination: /usr/share/icons

  - type: akmods
    base: main
    install:
      - xone

  - type: dnf
      install:
        packages:
          - steam
      remove:
        packages:
          - firefox
          - firefox-langpacks
          - gnome-tour
          - gnome-classic-session
          - gnome-shell-extension-apps-menu
          - gnome-shell-extension-background-logo
          - gnome-shell-extension-launch-new-instance
          - gnome-shell-extension-places-menu
          - gnome-shell-extension-window-list
          - gnome-extensions-app
          - gnome-weather
          - yelp
          - yelp-libs
          - yelp-tools
          - yelp-xsl
          - yelp-xsl-devel

  - type: gnome-extensions
      install:
        - 3628 # ArcMenu
        - 16 # Auto Move Windows
        - 3193 # Blur my Shell
        - 10070 # ChromaLeon
        - 3210 # Compiz window effect
        - 1160 # Dash to Panel
        - 3843 # Just Perfection

  - type: fonts
      fonts:
      google-fonts:
        - SUSE
        - Lato
        - JetBrains Mono

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.mozilla.firefox
          - org.mozilla.thunderbird
          - com.mattjakeman.ExtensionManager
          - page.tesk.Refine
          - org.gnome.Loupe
          - io.github.celluloid_player.Celluloid
          - com.toolstack.Folio
          - org.gnome.World.PikaBackup
          - org.fooyin.fooyin
      - scope: user

  - type: signing
